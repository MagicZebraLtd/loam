packages:
  - apps/*
  - packages/*

# Shared dev/build tooling versions live here once, and every workspace package references them with
# `"<dep>": "catalog:"`. This guarantees the versions stay aligned across the workspace — bump a tool
# in one place instead of hunting through eight package.json files (and no more silent drift like the
# esbuild 0.25-vs-0.28 split this replaced). Only deps used by 2+ packages belong here; single-package
# deps stay in their own manifest.
catalog:
  "@preact/preset-vite": ^2.10.6
  "@types/node": ^24.19.2
  esbuild: ^0.28.2
  jsdom: ^31.0.0
  preact: ^11.2.0
  tsx: ^4.23.15
  typescript: ~7.0.2
  vite: ^8.3.8
  vitest: ^5.1.0

onlyBuiltDependencies:
  - better-sqlite3-multiple-ciphers
  # The desktop app (apps/desktop): electron's postinstall downloads the Electron binary for this platform
  # (~100 MB, checksum-verified by @electron/get). Set ELECTRON_SKIP_BINARY_DOWNLOAD=1 to skip it where the
  # desktop app isn't run (CI's main job does).
  - electron
  - esbuild
  # llama.rn ships no native libs in its npm tarball — it downloads the prebuilt librnllama*.so via a
  # postinstall script. Without this allow-list entry pnpm skips that script, the Android build finds no
  # prebuilt libs, gradle silently produces NO librnllama_jni.so, and the on-device LLM fails at runtime
  # with "JSI bindings not installed". (build-apk.mjs also runs the downloader explicitly as a backstop.)
  - llama.rn

# Wait a day before installing a newly published version: most malicious releases are caught and
# pulled within hours. Applies when pnpm resolves (pnpm add / update, Dependabot); a frozen-lockfile
# install only fetches what the lockfile already names.
minimumReleaseAge: 1440

# `pnpm audit --prod --audit-level=high` runs in CI. These advisories have no usable patched release and
# reach LOAM only through Expo (its build tooling, `expo` > `@expo/cli`, which runs on the build machine,
# or the host app's own router); none reaches the server. Remove each entry once a fixed version exists.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3: stack exhaustion on deeply nested patterns. Path: expo > @expo/cli >
    # @expo/metro-file-map > micromatch > braces (Metro file watching at build time, fixed patterns).
    - GHSA-vfj7-8cjw-p6xm
    # zod <4.6.6: memory exhaustion validating oversized constrained collections. Path: expo > @expo/cli >
    # zod 3.25.76 (dev-tools plugin schemas; @expo/cli 57.0.32, the newest, still asks for ^3.25.76 and no
    # 3.x fix exists). LOAM's own schemas use zod 4.6.7, which is patched.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component <=0.5.0: quadratic time on malformed percent-encoding. Path: expo-router 57 >
    # query-string 7 > decode-uri-component 0.2.2. The fix (0.5.1) is ESM-only and query-string 7 require()s
    # it, so it can't be overridden; expo-router only parses the host app's own routes on the phone, never
    # anything a LAN client sends. Goes away with the move to Expo SDK 58 (expo-router 58).
    - GHSA-qr28-fpjm-wq7f
