# electron-builder config for LOAM's desktop app (`pnpm --filter @loam/desktop dist`). It packs the
# self-contained dist/ (scripts/build.mjs + scripts/native.mjs) and package.json, nothing from node_modules:
# package.json's `dependencies` is empty and npmRebuild is off, because the only native module (the SQLCipher
# driver) is already in dist/main/node_modules for the target platform and arch.
#
# Artifact names carry no version, so the website can link releases/latest/download/<name>:
#   LOAM-mac-arm64.dmg  LOAM-mac-x64.dmg  LOAM-win-x64.exe  LOAM-linux-x64.AppImage  LOAM-linux-x64.deb
#
# Signing: unsigned unless the CI provides credentials. macOS signs with CSC_LINK / CSC_KEY_PASSWORD, and
# notarizes only when APPLE_API_KEY (path to the .p8), APPLE_API_KEY_ID and APPLE_API_ISSUER are all set:
# `notarize: true` is skipped without them. With no certificate, build with
# `-c.mac.identity=- -c.mac.hardenedRuntime=false` (and CSC_IDENTITY_AUTO_DISCOVERY=false on a Mac that has a
# keychain identity): that ad-hoc signs the whole bundle, without which Apple Silicon reports a downloaded copy
# as "damaged" instead of offering Open Anyway. The hardened runtime has to go with it: its library validation
# needs a Team ID, which an ad-hoc signature hasn't got, so the app couldn't load its own Electron framework
# (tested: dyld refuses it). Neither is set here, because they would override a real certificate. A plain
# unsigned build (no flags) also launches: the fuse step re-signs the binary ad hoc. Windows signs with
# CSC_LINK / CSC_KEY_PASSWORD (or WIN_CSC_LINK) when present.

appId: com.loamnet.desktop
productName: LOAM
copyright: Copyright © Magic Zebra Ltd

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

asar: true
# A native addon can't be loaded from inside the archive: Electron loads it from app.asar.unpacked instead.
asarUnpack:
  - dist/main/node_modules/**/*.node

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Electron's build-time switches, flipped in the packaged binary. LOAM's binary must not double as a general
# Node interpreter (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect): on macOS the keychain trusts this binary
# with the network's key, so a program that could run its own code inside it could ask for that key. And it
# runs only the app it shipped with: app.asar alone, checked against the hash signed into the bundle.
electronFuses:
  # Flipping a fuse edits the Electron binary, which breaks its signature; on Apple Silicon the kernel kills a
  # binary with a broken signature at launch, so an unsigned build re-signs it ad hoc (a real certificate, when
  # present, signs over it afterwards).
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true

mac:
  target:
    - target: dmg
  category: public.app-category.social-networking
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  artifactName: LOAM-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  artifactName: LOAM-win-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: ../../LICENSE
  shortcutName: LOAM

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network
  icon: build/icon.png
  maintainer: Magic Zebra Ltd <opensource@magiczebra.co.uk>
  synopsis: Run a local, off-grid LOAM messaging network
  description: >-
    LOAM runs a local messaging network from this computer. People nearby join from their phone's browser by
    scanning a QR code: no internet, no accounts.

appImage:
  artifactName: LOAM-linux-${arch}.${ext}

deb:
  artifactName: LOAM-linux-${arch}.${ext}
